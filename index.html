<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng Hành Mục Tiêu</title>
    <style>
        /* Tông màu nền Gradient chuyển sắc mềm mại */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        /* Thẻ hiển thị dạng Kính Mờ (Glassmorphism) thời thượng */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Ô nhập số được bo tròn, đổi màu viền khi bấm vào */
        .input-group {
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 120px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-weight: bold;
            color: #444;
        }

        input[type="number"]:focus {
            border-color: #764ba2;
            box-shadow: 0 0 8px rgba(118, 75, 162, 0.3);
        }

        /* Nút bấm chuyển màu mượt mà + hiệu ứng nhấn */
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Ô hiển thị lời chúc/động viên */
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🌱 Nhật Ký Mục Tiêu</h2>
    <p>Hãy trung thực với tiến độ của bản thân nhé!</p>
    
    <div class="input-group">
        <input type="number" id="progressInput" min="0" max="100" placeholder="0 - 100"> 
        <span style="font-weight: bold; color: #555;">%</span>
    </div>

    <button onclick="checkProgress()">Gửi Tiến Độ</button>

    <div id="result"></div>
</div>

<script>
function checkProgress() {
    let percent = document.getElementById("progressInput").value;
    let resultDiv = document.getElementById("result");
    
    if (percent === "" || percent < 0 || percent > 100) {
        resultDiv.style.backgroundColor = "#ffe6e6";
        resultDiv.style.color = "#d8000c";
        resultDiv.innerHTML = "⚠️ Vui lòng nhập một con số từ 0 đến 100 nhé!";
        return;
    }

    if (percent >= 80) {
        resultDiv.style.backgroundColor = "#e6f4ea";
        resultDiv.style.color = "#137333";
        resultDiv.innerHTML = "🎉 <b>Xuất sắc lắm!</b> Bạn đang tiến rất gần đến đích. Hãy duy trì phong độ này nhé!";
    } else if (percent >= 50) {
        resultDiv.style.backgroundColor = "#feefc3";
        resultDiv.style.color = "#b06000";
        resultDiv.innerHTML = "💪 <b>Tiến độ rất ổn!</b> Đi được nửa chặng đường đã là một nỗ lực lớn. Cố lên một chút nữa thôi!";
    } else {
        resultDiv.style.backgroundColor = "#e8f0fe";
        resultDiv.style.color = "#1a73e8";
        resultDiv.innerHTML = "💙 <b>Đừng nản lòng nhé!</b> Con số này chỉ phản ánh khối lượng hiện tại. Chúng mình cùng chia nhỏ mục tiêu ra để dễ thở hơn nha!";
    }
}
</script>

</body>
</html>
